<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fb069">
<title>家庭点菜</title>
<link rel="stylesheet" href="css/style.css?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
</head>
<body>
  <!-- 全局背景层 -->
  <div id="bg-layer"></div>
  <div id="bg-fog"></div>

  <!-- 编辑模式提示条 -->
  <div id="edit-banner" class="hidden">
    <span class="edit-dot"></span> 正在编辑中，管理员模式
    <button id="exit-edit-btn" data-action="exit-edit">退出编辑</button>
  </div>

  <!-- 主内容 -->
  <main id="main"></main>

  <!-- 底部导航 -->
  <nav id="tabbar">
    <button class="tab-btn" data-tab="home">
      <span class="tab-icon">🏠</span><span class="tab-label">首页</span>
    </button>
    <button class="tab-btn" data-tab="order">
      <span class="tab-icon">📋</span><span class="tab-label">点单</span>
    </button>
    <button class="tab-btn" data-tab="cart">
      <span class="tab-icon">🛒</span><span class="tab-label">购物车</span>
      <span id="cart-badge" class="badge hidden">0</span>
    </button>
    <button class="tab-btn" data-tab="me">
      <span class="tab-icon">👤</span><span class="tab-label">我的</span>
    </button>
  </nav>

  <!-- 弹窗容器 -->
  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
